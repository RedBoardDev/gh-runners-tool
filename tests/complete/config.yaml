github:
  url: "https://github.com/YOUR_ORG"
  runner_group: "default"

runner:
  version: "latest"

groups:
  - name: "ghr-fast"
    max_runners: 3
    min_runners: 1
    labels:
      - "fast"
      - "macos"

  - name: "ghr-heavy"
    max_runners: 2
    min_runners: 0
    labels:
      - "heavy"
      - "macos"

  - name: "ghr-deploy"
    max_runners: 1
    min_runners: 0
    labels:
      - "deploy"
      - "macos"
    health:
      runner_timeout: "10m"

  - name: "ghr-single"
    max_runners: 1
    min_runners: 1
    labels:
      - "single"
      - "macos"

health:
  enabled: true
  check_interval: "10s"
  runner_timeout: "5m"
  idle_timeout: "2m"
  divergence_timeout: "1m"
  max_consecutive_failures: 3
  failure_cooldown: "30s"
  min_disk_space: "500MB"

logging:
  level: "debug"
  format: "text"
  retention_days: 7
  runner_output: true

notifications:
  discord:
    enabled: true
    events:
      - "health.*"
      - "daemon.*"
      - "runner.failed"
      - "runner.timeout"
    username: "ghr-test"
    mentions:
      error: ""
      critical: ""

monitoring:
  uptime_kuma:
    enabled: true
    degraded_threshold: 0.5
    report_health_as_ping: true

daemon:
  shutdown_timeout: "15s"
