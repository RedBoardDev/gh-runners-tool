version: 2

builds:
  - main: ./cmd/ghr
    binary: ghr
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X '{{ .ModulePath }}/internal/cli.version={{ .Version }}'
      - -X '{{ .ModulePath }}/internal/cli.commit={{ .ShortCommit }}'
      - -X '{{ .ModulePath }}/internal/cli.date={{ .Date }}'

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^style:"
      - "^chore\\(deps\\):"
  groups:
    - title: Features
      regexp: "^feat"
    - title: Bug Fixes
      regexp: "^fix"
    - title: Refactoring
      regexp: "^refactor"
    - title: Other
      order: 999

release:
  github:
    owner: RedBoardDev
    name: gh-runners-tool
  prerelease: auto
  name_template: "v{{ .Version }}"
