github:
  scope: org # or repo
  owner: your-org
  # repo: your-repo # required when scope=repo

defaults:
  workdir_base: /var/lib/ghr/groups
  cache_dir: /var/lib/ghr/cache
  version: latest

groups:
  - name: deploy-api
    count: 10
    ephemeral: true
    labels: [deploy, macos]
  - name: ci-default
    count: 5
    ephemeral: false
    labels: [ci, macos]

