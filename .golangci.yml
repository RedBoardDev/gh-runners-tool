version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - errorlint
    - bodyclose
    - contextcheck
    - nilerr
    - exhaustive

  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*log/slog.Logger).Info
        - (*log/slog.Logger).Debug
        - (*log/slog.Logger).Warn
        - (*log/slog.Logger).Error

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code

    exhaustive:
      default-signifies-exhaustive: true

  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - unparam
          - revive
      - linters:
          - gocritic
        text: "hugeParam: r is heavy"
        path: internal/logging/handler\.go
      - linters:
          - gocritic
        text: "filepathJoin"
        path: internal/launchd/
