github:
  url: "https://github.com/my-org"
  runner_group: "default"
  runner_group_id: 1

runner:
  version: "latest"
  cache_dir: ""
  workdir_base: ""

groups:
  - name: "runners"
    max_runners: 5
    min_runners: 0
    labels:
      - "macos"
    # priority: 0          # higher is served first when capacity is configured
    # reserve:             # held by each runner of this group while it exists
    #   memory: "2G"
    #   cpus: 1
    # resources:           # per-runner cgroup limits, Linux cgroup v2 only
    #   memory_max: "4G"
    #   memory_high: "3G"
    #   cpu_weight: 100

# capacity:                # host-wide budget shared by all groups
#   memory: "48G"
#   cpus: 40

health:
  enabled: true
  check_interval: "30s"
  runner_timeout: "2h"
  idle_timeout: "0"
  divergence_timeout: "5m"
  max_consecutive_failures: 5
  failure_cooldown: "1m"
  min_disk_space: "1GB"

logging:
  level: "info"
  format: "text"
  dir: ""
  retention_days: 30
  runner_output: true

notifications:
  discord:
    enabled: false
    events: []
    username: "ghr"
    avatar_url: ""
    mentions:
      error: ""
      critical: ""

monitoring:
  uptime_kuma:
    enabled: false
    degraded_threshold: 0.5
    report_health_as_ping: true

daemon:
  state_dir: ""
  shutdown_timeout: "30s"
